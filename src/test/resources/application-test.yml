JWT_SECRET: test-only-jwt-secret-that-is-at-least-32-bytes-long

spring:
  application:
    name: fintrack-test

  cloud:
    vault:
      enabled: false
    consul:
      enabled: false

  datasource:
    url: jdbc:h2:mem:fintrack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  mail:
    host: localhost
    port: 2525

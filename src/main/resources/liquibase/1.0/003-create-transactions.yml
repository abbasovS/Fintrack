
  databaseChangeLog:
    - changeSet:
        id: 003-create-transactions
        author: fintrack
        changes:
          - createTable:
              tableName: transactions
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      primaryKeyName: pk_transactions
                      nullable: false

                - column:
                    name: user_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: category_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: amount
                    type: NUMERIC(19,2)
                    constraints:
                      nullable: false

                - column:
                    name: type
                    type: VARCHAR(20)
                    constraints:
                      nullable: false

                - column:
                    name: description
                    type: VARCHAR(500)

                - column:
                    name: created_at
                    type: TIMESTAMP
                    constraints:
                      nullable: false

          - addForeignKeyConstraint:
              baseTableName: transactions
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: id
              constraintName: fk_transactions_user

          - addForeignKeyConstraint:
              baseTableName: transactions
              baseColumnNames: category_id
              referencedTableName: categories
              referencedColumnNames: id
              constraintName: fk_transactions_category

          - createIndex:
              tableName: transactions
              indexName: idx_transactions_user_id
              columns:
                - column:
                    name: user_id

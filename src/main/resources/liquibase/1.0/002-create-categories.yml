
  databaseChangeLog:
    - changeSet:
        id: 002-create-categories
        author: fintrack
        changes:
          - createTable:
              tableName: categories
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      primaryKeyName: pk_categories
                      nullable: false

                - column:
                    name: name
                    type: VARCHAR(100)
                    constraints:
                      nullable: false

                - column:
                    name: type
                    type: VARCHAR(20)
                    constraints:
                      nullable: false



  databaseChangeLog:
    - changeSet:
        id: 001-create-users
        author: fintrack
        changes:
          - createTable:
              tableName: users
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      primaryKeyName: pk_users
                      nullable: false

                - column:
                    name: name
                    type: VARCHAR(100)
                    constraints:
                      nullable: false

                - column:
                    name: email
                    type: VARCHAR(150)
                    constraints:
                      nullable: false

                - column:
                    name: password
                    type: VARCHAR(255)
                    constraints:
                      nullable: false

                - column:
                    name: created_at
                    type: TIMESTAMP
                    constraints:
                      nullable: false

          - addUniqueConstraint:
              tableName: users
              columnNames: email
              constraintName: uk_users_email

databaseChangeLog:
  - changeSet:
      id: 005-add-category-ownership-and-report-indexes
      author: fintrack
      changes:
        - addColumn:
            tableName: categories
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: categories
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_categories_user
        - createIndex:
            tableName: categories
            indexName: idx_categories_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: transactions
            indexName: idx_transactions_user_created_at
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
